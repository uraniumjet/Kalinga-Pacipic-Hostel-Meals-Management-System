{% extends "base.html" %}

{% block content %}

<div class="row">

<div class="col-md-4">

<div class="card p-3">

<h4>Register Student</h4>

<form method="POST">

{% csrf_token %}

{{ form.as_p }}

<button class="btn btn-primary w-100">
Add Student
</button>

</form>

</div>

</div>


<div class="col-md-8">

<div class="card p-3">

<h4>Student List</h4>

<table class="table table-hover">

<tr>
<th>ID</th>
<th>Name</th>
<th>Room</th>
<th>QR</th>
</tr>

{% for student in students %}

<tr>

<td>{{ student.student_id }}</td>
<td>{{ student.name }}</td>
<td>{{ student.room_number }}</td>

<td>
<img src="{{ student.qr_code.url }}" width="60">
</td>

</tr>

{% endfor %}

</table>

</div>

</div>

</div>

{% endblock %}
