{% extends "accounts/base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="login-wrap justify-content-center">
  <div class="card shadow-sm" style="width:100%;max-width:25rem">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <span class="brand-mark mb-3" style="width:3rem;height:3rem;font-size:1.5rem"><i class="bi bi-egg-fried"></i></span>
        <h1 class="h4 mb-1">Hostel Meals</h1>
        <p class="text-body-secondary mb-0">Sign in to continue</p>
      </div>
      <form method="post">{% csrf_token %}
        {% if form.non_field_errors %}<div class="alert alert-danger py-2" role="alert">Wrong username or password.</div>{% endif %}
        <div class="mb-3">
          <label for="id_username" class="form-label">Username</label>
          <input type="text" name="username" id="id_username" class="form-control form-control-lg" autofocus autocomplete="username" required>
        </div>
        <div class="mb-4">
          <label for="id_password" class="form-label">Password</label>
          <input type="password" name="password" id="id_password" class="form-control form-control-lg" autocomplete="current-password" required>
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn btn-primary btn-lg w-100">Sign in</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
