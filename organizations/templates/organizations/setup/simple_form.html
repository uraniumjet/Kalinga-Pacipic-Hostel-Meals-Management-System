{% extends "accounts/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6">
<h1 class="h3 mb-3">{{ title }}</h1>
<form method="post">{% csrf_token %}
  {% include "accounts/_form_errors.html" %}
  <div class="card"><div class="card-body">{% for field in form %}{% include "accounts/_field.html" with field=field %}{% endfor %}</div></div>
  <div class="mt-3 d-flex gap-2"><button type="submit" class="btn btn-primary px-4">Save</button><a class="btn btn-outline-secondary" href="{{ back_url }}">Cancel</a></div>
</form>
</div></div>
{% endblock %}
